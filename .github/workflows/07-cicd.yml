name: Exercise 07 CI/CD

on:
  pull_request:
    branches:
      - develop
      - production
    paths:
      - "07_CI_CD/**"
      - ".github/workflows/07-cicd.yml"
  push:
    branches:
      - develop
      - production
    paths:
      - "07_CI_CD/**"
      - ".github/workflows/07-cicd.yml"

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Deterministic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_CI_CD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            07_CI_CD/requirements.txt
            07_CI_CD/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -m unit

      - name: Functional tests
        run: pytest -m functional

  live-tests:
    name: Live Gemini tests
    needs: deterministic-tests
    runs-on: ubuntu-latest
    environment: ci
    defaults:
      run:
        working-directory: 07_CI_CD
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            07_CI_CD/requirements.txt
            07_CI_CD/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Gemini integration test
        run: pytest -m integration

      - name: LLM evaluation test
        run: pytest -m eval

  container:
    name: Build container
    needs:
      - deterministic-tests
      - live-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t learning-cicd-api:${{ github.sha }} 07_CI_CD

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs:
      - container
      - live-tests
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      APP_API_KEY: ${{ secrets.APP_API_KEY }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: learning-services
    steps:
      - uses: actions/checkout@v4

      - name: Select environment
        run: |
          if [[ "${GITHUB_REF_NAME}" == "production" ]]; then
            echo "APP_ENV=production" >> "$GITHUB_ENV"
            echo "SERVICE_NAME=mew-cicd-api-prod" >> "$GITHUB_ENV"
          else
            echo "APP_ENV=development" >> "$GITHUB_ENV"
            echo "SERVICE_NAME=mew-cicd-api-dev" >> "$GITHUB_ENV"
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/learning-cicd-api:${GITHUB_SHA}"
          docker build -t "$IMAGE" 07_CI_CD
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "APP_ENV=$APP_ENV,GEMINI_MODEL=gemini-2.5-flash" \
            --set-secrets "GOOGLE_API_KEY=gemini-api-key:latest,APP_API_KEY=app-api-key:latest" \
            --quiet

      - name: Smoke test public endpoint
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "Deployed URL: $SERVICE_URL"
          curl --fail --retry 5 --retry-delay 5 "$SERVICE_URL/health"
          curl --fail --retry 3 --retry-delay 5 \
            -X POST "$SERVICE_URL/answer" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $APP_API_KEY" \
            -d '{"question":"What is continuous integration?"}'
